<!-- Local, plain JS: no transpile step needed. -->
<script src="./_ds_bundle.js"></script>
<script src="./site-config.js"></script>
<script src="./translations.js"></script>

<!--
  Boot loader. Three jobs:
   1. Production React (≈8x smaller than the dev build), no SRI — mobile
      carriers in ID transcode script responses, which silently fails
      integrity checks and leaves a permanently blank page.
   2. Every dependency falls back to a second CDN, then a third.
   3. The JSX is fetched and transpiled explicitly. Babel's own
      transformScriptTags() skips src'd <script type="text/babel"> tags when
      Babel itself arrives after DOMContentLoaded — which is exactly what
      happens on a slow mobile connection.
-->
<script>
(function () {
  var HOSTS = [
    'https://cdn.jsdelivr.net/npm/',
    'https://unpkg.com/',
    'https://cdnjs.cloudflare.com/ajax/libs/'
  ];
  var DEPS = [
    { paths: ['react@18.3.1/umd/react.production.min.js',
              'react@18.3.1/umd/react.production.min.js',
              'react/18.3.1/umd/react.production.min.js'],
      ready: function () { return !!window.React; } },
    { paths: ['react-dom@18.3.1/umd/react-dom.production.min.js',
              'react-dom@18.3.1/umd/react-dom.production.min.js',
              'react-dom/18.3.1/umd/react-dom.production.min.js'],
      ready: function () { return !!(window.ReactDOM && window.ReactDOM.createRoot); } },
    { paths: ['@babel/standalone@7.29.0/babel.min.js',
              '@babel/standalone@7.29.0/babel.min.js',
              'babel-standalone/6.26.0/babel.min.js'],
      ready: function () { return !!(window.Babel && window.Babel.transform); } }
  ];

  var boot = document.getElementById('stow-boot');
  var slowTimer = setTimeout(function () { if (boot) boot.className = 'is-slow'; }, 9000);

  function fetchDep(i, host, done) {
    if (host >= HOSTS.length) { done(false); return; }
    var dep = DEPS[i];
    var s = document.createElement('script');
    s.src = HOSTS[host] + dep.paths[Math.min(host, dep.paths.length - 1)];
    s.async = false;
    s.onload = function () { dep.ready() ? done(true) : fetchDep(i, host + 1, done); };
    s.onerror = function () { fetchDep(i, host + 1, done); };
    document.head.appendChild(s);
  }

  function step(i) {
    if (i >= DEPS.length) { runApp(); return; }
    if (DEPS[i].ready()) { step(i + 1); return; }
    fetchDep(i, 0, function (ok) { ok ? step(i + 1) : fail(); });
  }

  var SOURCES = ['./SiteKit.jsx', './SitePages.jsx', './SitePages2.jsx', './SiteApp.jsx'];

  /* Inline <script> rather than eval() so function declarations land in global
     scope, the way the original tags behaved. */
  function exec(code) {
    var s = document.createElement('script');
    s.textContent = code;
    document.body.appendChild(s);
  }

  function runApp() {
    var texts = new Array(SOURCES.length);
    var left = SOURCES.length;
    var broke = false;

    SOURCES.forEach(function (url, i) {
      var x = new XMLHttpRequest();
      x.open('GET', url, true);
      x.onload = function () {
        if (x.status >= 200 && x.status < 300) { texts[i] = x.responseText; }
        else { broke = true; }
        if (--left === 0) { compile(); }
      };
      x.onerror = function () { broke = true; if (--left === 0) { compile(); } };
      x.send();
    });

    function compile() {
      if (broke) { fail(); return; }
      try {
        for (var i = 0; i < texts.length; i++) {
          exec(window.Babel.transform(texts[i], { presets: ['react'] }).code);
        }
        exec('ReactDOM.createRoot(document.getElementById("root"))' +
             '.render(React.createElement(SiteApp, { stage: "waitlist", showRates: true }));');
      } catch (e) {
        fail();
        return;
      }
      clearTimeout(slowTimer);
      if (!document.getElementById('root').firstChild) { fail(); }
    }
  }

  function fail() {
    clearTimeout(slowTimer);
    if (boot) boot.className = 'is-slow';
  }

  step(0);
})();
</script>
